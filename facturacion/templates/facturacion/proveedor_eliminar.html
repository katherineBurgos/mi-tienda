{% extends "base.html" %}
{% block titulo %}Eliminar proveedor{% endblock %}
{% block contenido %}
<section class="tarjeta">
    <h1 class="titulo-pagina">Eliminar proveedor</h1>
    <p>¿Seguro que deseas eliminar al proveedor <strong>{{ proveedor }}</strong>?</p>
    <p class="texto-suave">No se puede eliminar un proveedor que ya tiene compras registradas.</p>
    <form method="post" class="botonera">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a class="boton-secundario-accion" href="{% url 'facturacion:proveedor_lista' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
